<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockCare Storefront</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 12px; color: #1e293b; padding-bottom: 80px; }
    
    /* Top Header & Cart Bar */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h2 { margin: 0; font-size: 18px; color: #0f172a; }
    .cart-badge { background: #2563eb; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* Search Input */
    .search-box { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; margin-bottom: 12px; background: #fff; }
    .search-box:focus { border-color: #2563eb; }

    /* Category Chips */
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .chip { background: #e2e8f0; color: #475569; padding: 6px 14px; border-radius: 16px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; border: none; }
    .chip.active { background: #0f172a; color: #fff; }

    /* Product Cards */
    .card { background: #fff; padding: 12px 14px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; color: #0f172a; }
    .item-code { color: #64748b; font-size: 11px; margin-bottom: 2px; }
    .item-qty { color: #059669; font-size: 12px; font-weight: 600; }
    
    /* Quantity Controls */
    .btn-add { background: #2563eb; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .qty-controls { display: flex; align-items: center; gap: 8px; }
    .btn-qty { background: #f1f5f9; border: 1px solid #cbd5e1; width: 28px; height: 28px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #0f172a; }
    .qty-count { font-weight: 600; font-size: 13px; min-width: 16px; text-align: center; }

    #status-msg { text-align: center; color: #64748b; font-size: 14px; margin-top: 30px; }
  </style>
</head>
<body>

  <!-- Header with Cart -->
  <div class="header">
    <h2>💊 StockCare Store</h2>
    <div class="cart-badge" id="cartBadge">
      🛒 Cart (<span id="cartCount">0</span>)
    </div>
  </div>

  <!-- Search Box -->
  <input type="text" id="searchInput" class="search-box" placeholder="Search by item name or code...">

  <!-- Category Filter Buttons -->
  <div class="categories" id="categoryContainer">
    <button class="chip active" onclick="filterCategory('All', this)">All</button>
  </div>

  <!-- Catalog List -->
  <div id="catalog">
    <div id="status-msg">Loading available stock...</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDwLSXmSgobcntmbgToDmkWjaF-oe-P5tvGEV2zonux6uTjAaXknBcmljm16daOVDmPQ/exec";

    const tg = window.Telegram.WebApp;
    tg.expand();

    let allProducts = [];
    let activeCategory = 'All';
    let cart = {}; // Store selected items { item_ID: { details, qty } }

    // 1. Fetch products from backend
    fetch(`${SCRIPT_URL}?action=getCatalog`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success' && data.products && data.products.length > 0) {
          // Filter to items with Total_Qty_Bridge > 0
          allProducts = data.products.filter(prod => parseFloat(prod.Total_Qty_Bridge || 0) > 0);

          buildCategoryChips(allProducts);
          renderCatalog();
        } else {
          document.getElementById('catalog').innerHTML = '<div id="status-msg">No products available.</div>';
        }
      })
      .catch(() => {
        document.getElementById('catalog').innerHTML = '<div id="status-msg">Failed to load catalog.</div>';
      });

    // 2. Build Category Chips dynamically
    function buildCategoryChips(products) {
      const container = document.getElementById('categoryContainer');
      const categories = ['All', ...new Set(products.map(p => p.Category || 'Uncategorized').filter(Boolean))];

      container.innerHTML = categories.map(cat => `
        <button class="chip ${cat === 'All' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
      `).join('');
    }

    // 3. Category Filter Action
    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderCatalog();
    }

    // 4. Search Filter Input Event
    document.getElementById('searchInput').addEventListener('input', () => {
      renderCatalog();
    });

    // 5. Render Products based on Search + Category Filter
    function renderCatalog() {
      const catalogDiv = document.getElementById('catalog');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      const filtered = allProducts.filter(prod => {
        const matchesCategory = (activeCategory === 'All') || ((prod.Category || 'Uncategorized') === activeCategory);
        const matchesSearch = (prod.Item_Name || '').toLowerCase().includes(searchTerm) || 
                              (prod.item_code || '').toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
      });

      catalogDiv.innerHTML = '';

      if (filtered.length === 0) {
        catalogDiv.innerHTML = '<div id="status-msg">No matching items found.</div>';
        return;
      }

      filtered.forEach(prod => {
        const itemId = prod.item_ID;
        const currentQty = cart[itemId] ? cart[itemId].qty : 0;
        const maxQty = parseFloat(prod.Total_Qty_Bridge || 0);

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="item-code">${prod.item_code || ''}</div>
            <div class="item-title">${prod.Item_Name || 'Unnamed Item'}</div>
            <div class="item-qty">In Stock: ${maxQty}</div>
          </div>
          <div id="controls-${itemId}">
            ${currentQty === 0 
              ? `<button class="btn-add" onclick="updateQty('${itemId}', 1, ${maxQty})">Add</button>`
              : `<div class="qty-controls">
                  <button class="btn-qty" onclick="updateQty('${itemId}', -1, ${maxQty})">-</button>
                  <span class="qty-count">${currentQty}</span>
                  <button class="btn-qty" onclick="updateQty('${itemId}', 1, ${maxQty})">+</button>
                </div>`
            }
          </div>
        `;
        catalogDiv.appendChild(card);
      });
    }

    // 6. Add/Subtract Quantity and update Cart
    function updateQty(itemId, change, maxQty) {
      const prod = allProducts.find(p => p.item_ID === itemId);
      if (!prod) return;

      if (!cart[itemId]) {
        cart[itemId] = { product: prod, qty: 0 };
      }

      const newQty = cart[itemId].qty + change;

      if (newQty > maxQty) {
        tg.showAlert && tg.showAlert(`Only ${maxQty} items available in stock.`);
        return;
      }

      if (newQty <= 0) {
        delete cart[itemId];
      } else {
        cart[itemId].qty = newQty;
      }

      updateCartBadge();
      renderCatalog();
    }

    // 7. Update Top Cart Counter
    function updateCartBadge() {
      const totalItems = Object.values(cart).reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartCount').textContent = totalItems;
    }
  </script>
</body>
</html>
