<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockCare Online Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; color: #1e293b; }
    h2 { color: #0f172a; margin-top: 0; font-size: 20px; text-align: center; margin-bottom: 15px; }
    .card { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: center; }
    .item-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .item-price { color: #059669; font-size: 14px; font-weight: bold; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.2s; }
    .btn:active { background: #1d4ed8; }
    .cart { background: #fff; padding: 16px; border-radius: 12px; margin-top: 20px; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .cart h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; }
    .cart-line { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; }
    input:focus, textarea:focus { border-color: #2563eb; }
    .checkout-btn { background: #16a34a; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .checkout-btn:active { background: #15803d; }
    #status-msg { text-align: center; color: #64748b; font-size: 14px; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>💊 StockCare Pharmacy</h2>
  <div id="catalog">
    <div id="status-msg">Loading products from StockCare...</div>
  </div>

  <div class="cart">
    <h3>🛒 Your Order</h3>
    <div id="cart-items" style="color: #64748b; font-size: 14px;">No items selected.</div>
    <p style="font-size: 16px; margin-top: 15px;"><strong>Total: <span id="cart-total" style="color: #059669;">0</span> ETB</strong></p>
    
    <label style="font-size: 13px; font-weight: 600;">Full Name:</label>
    <input type="text" id="cust-name" placeholder="Enter your full name">

    <label style="font-size: 13px; font-weight: 600;">Phone Number:</label>
    <input type="tel" id="cust-phone" placeholder="09xxxxxxxx">

    <label style="font-size: 13px; font-weight: 600;">Delivery Address / Landmarks:</label>
    <textarea id="cust-address" rows="2" placeholder="Street, area, nearby landmark..."></textarea>

    <button class="checkout-btn" onclick="submitOrder()">Place Order</button>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDwLSXmSgobcntmbgToDmkWjaF-oe-P5tvGEV2zonux6uTjAaXknBcmljm16daOVDmPQ/exec";

    let catalogData = [];
    let cart = [];

    // Initialize Telegram Web App SDK
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Fetch Catalog from Google Apps Script Bridge
    fetch(`${SCRIPT_URL}?action=getCatalog`)
      .then(res => res.json())
      .then(data => {
        const catalogDiv = document.getElementById('catalog');
        catalogDiv.innerHTML = '';
        
        if (data.status === 'success' && data.products && data.products.length > 0) {
          catalogData = data.products;
          data.Store_Stock.forEach((prod, index) => {
            const name = prod["Item_ID"] || prod["Stock_Label"] || prod["Item_ID"] || "Medicine";
            const price = prod["Selling_Price"] || prod["Selling_Price"] || 0;
            
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <div>
                <div class="item-title">${name}</div>
                <div class="item-price">${price} ETB</div>
              </div>
              <button class="btn" onclick="addToCart(${index})">+ Add</button>
            `;
            catalogDiv.appendChild(card);
          });
        } else {
          catalogDiv.innerHTML = '<div id="status-msg">No products found or failed to load.</div>';
        }
      })
      .catch(err => {
        document.getElementById('catalog').innerHTML = '<div id="status-msg">Error connecting to store.</div>';
      });

    function addToCart(index) {
      const item = catalogData[index];
      const name = item["Item_ID"] || item["Stock_Label"] || item["Item_ID"] || "Medicine";
      const price = parseFloat(item["Selling_Price"] || item["Selling_Price"] || 0);

      const existing = cart.find(c => c.index === index);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({
          index: index,
          name: name,
          price: price,
          quantity: 1
        });
      }
      renderCart();
    }

    function renderCart() {
      const cartDiv = document.getElementById('cart-items');
      const totalSpan = document.getElementById('cart-total');
      
      if (cart.length === 0) {
        cartDiv.innerHTML = 'No items selected.';
        cartDiv.style.color = '#64748b';
        totalSpan.innerText = '0';
        return;
      }
      
      let html = '';
      let total = 0;
      cart.forEach(c => {
        const subtotal = c.price * c.quantity;
        total += subtotal;
        html += `
          <div class="cart-line">
            <span>${c.name} x${c.quantity}</span>
            <span><strong>${subtotal} ETB</strong></span>
          </div>
        `;
      });
      cartDiv.innerHTML = html;
      totalSpan.innerText = total;
    }

    function submitOrder() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();

      if (cart.length === 0) return alert('Your cart is empty!');
      if (!name || !phone || !address) return alert('Please complete all contact details.');

      const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      const orderPayload = {
        action: "createOrder",
        order: {
          customerName: name,
          phoneNumber: phone,
          address: address,
          totalAmount: totalAmount,
          items: cart
        }
      };

      // Disable button during processing
      const btn = document.querySelector('.checkout-btn');
      btn.innerText = "Processing...";
      btn.disabled = true;

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(orderPayload)
      })
      .then(res => res.json())
      .then(res => {
        alert('Order submitted successfully! You will receive a confirmation shortly.');
        cart = [];
        renderCart();
        tg.close();
      })
      .catch(err => {
        alert('Error placing order. Please try again.');
        btn.innerText = "Place Order";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
