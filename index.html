<script>
    const API_URL = "https://stockcare-bot.zbabelm.workers.dev";
    
    const STANDALONE_CATEGORIES = [
      "Cosmetics", 
      "Baby Care", 
      "Baby Food & Milk",
      "Milk and Cereal foods",
      "Medical Devices & Supplies"
    ];

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      try { tg.expand(); } catch(e) {}
    }

    const telegramUserId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;
    const telegramInitData = (tg && tg.initData) ? tg.initData : null;

    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const user = tg.initDataUnsafe.user;
      const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
      if (fullName) {
        document.addEventListener('DOMContentLoaded', () => {
          const nameField = document.getElementById('customerName');
          if (nameField && !nameField.value) nameField.value = fullName;
        });
      }
    }

    let allProducts = [];
    let activeCategory = 'All';
    let activeSubCategory = 'All';
    let cart = {}; 

    // Persistent Cart & Catalog Recovery
    const savedCart = localStorage.getItem('stockcare_cart_backup');
    if (savedCart) {
      try { cart = JSON.parse(savedCart); } catch(e) {}
    }

    const cachedProducts = localStorage.getItem('stockcare_catalog_cache');
    if (cachedProducts) {
      try {
        allProducts = JSON.parse(cachedProducts);
        if (allProducts.length > 0) {
          buildCategoryChips(allProducts);
          renderCatalog();
          updateTotals();
        }
      } catch (e) {
        console.warn("Cache parse error", e);
      }
    }

    // Network Fetch with robust key mapping for AppSheet tables
    fetch(`${API_URL}/?action=getCatalog`)
      .then(res => {
        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
        return res.json();
      })
      .then(data => {
        const rawProducts = data.products || data.rows || (Array.isArray(data) ? data : []);
        if (data && (data.status === 'success' || rawProducts.length > 0)) {
          allProducts = rawProducts.map(prod => ({
            item_ID: prod.item_ID || prod.item_id || prod.ID || prod.id || prod.Product_ID || '',
            item_code: prod.item_code || prod.Item_Code || prod.Code || '',
            Item_Name: prod.Item_Name || prod.item_name || prod.Name || prod.Product_Name || 'Unnamed Item',
            Category: prod.Category || prod.category || 'Uncategorized',
            Selling_Price: prod.Selling_Price || prod.selling_price || prod.Price || prod.Unit_Price || 0,
            Total_Qty_Bridge: prod.Total_Qty_Bridge || prod.total_qty_bridge || prod.Qty || prod.Stock_Qty || 0,
            Stock_Status: prod.Stock_Status || prod.stock_status || 'Good',
            Expiry_Date: prod.Expiry_Date || prod.expiry_date || prod.Expiry || '',
            Product_Image_Url: prod.Product_Image_Url || prod.product_image_url || prod.ImageUrl || prod.image_url || ''
          })).filter(prod => {
            const isNotExpired = (prod.Stock_Status || '').toLowerCase() !== 'expired';
            const qtyAvailable = parseFloat(prod.Total_Qty_Bridge || 0) > 0;
            return isNotExpired && qtyAvailable;
          });

          localStorage.setItem('stockcare_catalog_cache', JSON.stringify(allProducts));

          if (allProducts.length === 0) {
            document.getElementById('catalog').innerHTML = '<div id="status-msg">No products currently in stock.</div>';
            return;
          }

          buildCategoryChips(allProducts);
          renderCatalog();
          updateTotals();
        } else {
          document.getElementById('catalog').innerHTML = `<div id="status-msg">No products available or invalid response format.</div>`;
        }
      })
      .catch(err => {
        console.error("Catalog Fetch Error:", err);
        if (allProducts.length === 0) {
          document.getElementById('catalog').innerHTML = `<div id="status-msg">Failed to load items: ${err.message}. Check Worker URL & CORS.</div>`;
        }
      });

    function isStandaloneCategory(catName) {
      const name = (catName || '').trim().toLowerCase();
      return STANDALONE_CATEGORIES.some(sc => sc.toLowerCase() === name || name.includes('baby') || name.includes('cosmetic') || name.includes('device') || name.includes('supply') || name.includes('cereal'));
    }

    function buildCategoryChips(products) {
      const container = document.getElementById('categoryContainer');
      const presentCats = new Set(products.map(p => (p.Category || '').trim()));
      
      const categoryList = ['All', 'Baby Care', 'Baby Food & Milk', 'Cosmetics', 'Medical Devices & Supplies'];

      const hasMedicine = Array.from(presentCats).some(cat => !isStandaloneCategory(cat));
      if (hasMedicine && !categoryList.includes('Medicine')) {
        categoryList.push('Medicine');
      }

      container.innerHTML = categoryList.map(cat => `
        <button class="chip ${cat === activeCategory ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
      `).join('');

      buildMedicineSubCategories(products);
    }

    function buildMedicineSubCategories(products) {
      const select = document.getElementById('subCategorySelect');
      const medCategories = new Set();

      products.forEach(p => {
        const cat = (p.Category || 'Uncategorized').trim();
        if (!isStandaloneCategory(cat)) {
          medCategories.add(cat);
        }
      });

      const options = ['<option value="All">All Medicines</option>'];
      Array.from(medCategories).sort().forEach(cat => {
        options.push(`<option value="${cat}">${cat}</option>`);
      });

      select.innerHTML = options.join('');
    }

    function filterCategory(cat, btn) {
      activeCategory = cat;
      activeSubCategory = 'All';
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');

      const subBar = document.getElementById('subCategoryBar');
      if (cat === 'Medicine') {
        subBar.classList.add('active');
        document.getElementById('subCategorySelect').value = 'All';
      } else {
        subBar.classList.remove('active');
      }

      renderCatalog();
    }

    function filterSubCategory(subCat) {
      activeSubCategory = subCat;
      renderCatalog();
    }

    document.getElementById('searchInput').addEventListener('input', () => {
      renderCatalog();
    });

    function levenshteinDistance(a, b) {
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrix[i][j] = matrix[i - 1][j - 1];
          } else {
            matrix[i][j] = Math.min(
              matrix[i - 1][j - 1] + 1,
              matrix[i][j - 1] + 1,
              matrix[i - 1][j] + 1
            );
          }
        }
      }
      return matrix[b.length][a.length];
    }

    function renderCatalog() {
      const catalogDiv = document.getElementById('catalog');
      const suggestionBox = document.getElementById('suggestionBox');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();

      suggestionBox.style.display = 'none';

      let categoryFiltered = allProducts.filter(prod => {
        const cat = (prod.Category || 'Uncategorized').trim();
        if (activeCategory === 'All') return true;
        
        if (activeCategory === 'Baby Food & Milk') {
          return cat.toLowerCase() === 'milk and cereal foods';
        }

        if (isStandaloneCategory(activeCategory)) {
          return isStandaloneCategory(cat) && cat.toLowerCase().includes(activeCategory.toLowerCase().split(' ')[0]);
        }
        
        if (activeCategory === 'Medicine') {
          const isMed = !isStandaloneCategory(cat);
          if (!isMed) return false;
          if (activeSubCategory === 'All') return true;
          return cat === activeSubCategory;
        }
        return true;
      });

      let finalFiltered = categoryFiltered;

      if (searchTerm.length > 0) {
        finalFiltered = categoryFiltered.filter(prod => {
          return (prod.Item_Name || '').toLowerCase().includes(searchTerm) || 
                 (prod.item_code || '').toLowerCase().includes(searchTerm);
        });

        if (finalFiltered.length === 0 && searchTerm.length >= 3) {
          const matchedSet = new Set();
          const matchedNames = new Set();

          categoryFiltered.forEach(prod => {
            const name = (prod.Item_Name || '').toLowerCase();
            const words = name.split(/\s+/);

            words.forEach(word => {
              const dist = levenshteinDistance(searchTerm, word);
              const maxAllowedDist = searchTerm.length <= 4 ? 1 : 2;
              if (dist <= maxAllowedDist) {
                matchedSet.add(prod);
                matchedNames.add(prod.Item_Name);
              }
            });
          });

          if (matchedSet.size > 0) {
            finalFiltered = Array.from(matchedSet);
            const suggestionsList = Array.from(matchedNames).slice(0, 3).join(', ');
            suggestionBox.innerHTML = `Showing similar items for <strong>"${searchTerm}"</strong>: <em>${suggestionsList}${matchedNames.size > 3 ? '...' : ''}</em>`;
            suggestionBox.style.display = 'block';
          }
        }
      }

      catalogDiv.innerHTML = '';

      if (finalFiltered.length === 0) {
        catalogDiv.innerHTML = '<div id="status-msg">No matching items found.</div>';
        return;
      }

      finalFiltered.forEach(prod => {
        const itemId = prod.item_ID;
        const currentQty = cart[itemId] ? cart[itemId].qty : 0;
        const maxQty = parseFloat(prod.Total_Qty_Bridge || 0);
        
        const price = prod.Selling_Price ? parseFloat(prod.Selling_Price).toFixed(2) : '0.00';
        const expiry = formatExpiry(prod.Expiry_Date);
        const expiringSoon = isExpiringSoon(prod.Expiry_Date);

        const stockBadgeClass = maxQty <= 5 ? 'badge-stock-low' : 'badge-stock-good';
        const expBadgeClass = expiringSoon ? 'badge-exp-warn' : 'badge-exp-normal';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          ${prod.Product_Image_Url 
            ? `<img src="${prod.Product_Image_Url}" class="item-thumbnail" alt="${prod.Item_Name || 'Product Image'}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/56?text=No+Img';">` 
            : `<div class="item-thumbnail" style="display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:10px;">No Image</div>`
          }
          <div class="item-info">
            <div class="item-code">${prod.item_code || ''}</div>
            <div class="item-title">${prod.Item_Name || 'Unnamed Item'}</div>
            <div class="item-price">${price} ETB</div>
            <div class="item-meta">
              <span class="badge ${stockBadgeClass}">Stock: ${maxQty}</span>
              ${expiry ? `<span class="badge ${expBadgeClass}">Exp: ${expiry}</span>` : ''}
            </div>
          </div>
          <div id="controls-${itemId}">
            ${currentQty === 0 
              ? `<button class="btn-add" onclick="updateQty('${itemId}', 1, ${maxQty})">Add</button>`
              : `<div class="qty-controls">
                  <button class="btn-qty" onclick="updateQty('${itemId}', -1, ${maxQty})">-</button>
                  <span class="qty-count">${currentQty}</span>
                  <button class="btn-qty" onclick="updateQty('${itemId}', 1, ${maxQty})">+</button>
                </div>`
            }
          </div>
        `;
        catalogDiv.appendChild(card);
      });
    }

    function isExpiringSoon(dateStr) {
      if (!dateStr) return false;
      try {
        const parts = dateStr.split(/[\/\-]/);
        if (parts.length === 3) {
          const expDate = parts[0].length === 4 ? new Date(parts[0], parts[1] - 1, parts[2]) : new Date(parts[2], parts[0] - 1, parts[1]);
          const now = new Date();
          const diffDays = (expDate - now) / (1000 * 60 * 60 * 24);
          return diffDays >= 0 && diffDays <= 30;
        }
      } catch (e) {
        return false;
      }
      return false;
    }

    function formatExpiry(dateStr) {
      if (!dateStr) return '';
      try {
        const parts = dateStr.split(/[\/\-]/);
        if (parts.length === 3) {
          if (parts[0].length === 4) {
            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
          }
          return `${parts[2]}-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}`;
        }
        return dateStr;
      } catch (e) {
        return dateStr;
      }
    }

    function updateQty(itemId, change, maxQty) {
      const prod = allProducts.find(p => p.item_ID === itemId);
      if (!prod) return;

      if (!cart[itemId]) {
        cart[itemId] = { product: prod, qty: 0 };
      }

      const newQty = cart[itemId].qty + change;

      if (newQty > maxQty) {
        if (tg && tg.showAlert) { tg.showAlert(`Only ${maxQty} items available in stock.`); } else { alert(`Only ${maxQty} items available in stock.`); }
        return;
      }

      if (newQty <= 0) {
        delete cart[itemId];
      } else {
        cart[itemId].qty = newQty;
      }

      localStorage.setItem('stockcare_cart_backup', JSON.stringify(cart));
      updateTotals();
      renderCatalog();
      if (document.getElementById('cartModal').classList.contains('active')) {
        renderCartModalItems();
      }
    }

    function updateTotals() {
      let totalItems = 0;
      let grandTotal = 0;

      Object.values(cart).forEach(entry => {
        totalItems += entry.qty;
        const price = parseFloat(entry.product.Selling_Price || 0);
        grandTotal += price * entry.qty;
      });

      document.getElementById('cartCount').textContent = totalItems;
      document.getElementById('barTotal').textContent = `${grandTotal.toFixed(2)} ETB`;
      
      const btnCheckout = document.getElementById('btnBarCheckout');
      btnCheckout.disabled = totalItems === 0;
      btnCheckout.textContent = totalItems > 0 ? `View Cart (${totalItems})` : 'View Cart';
    }

    function openCartModal() {
      if (Object.keys(cart).length === 0) return;
      renderCartModalItems();
      document.getElementById('cartModal').classList.add('active');
      captureGPSLocation(false);
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function renderCartModalItems() {
      const container = document.getElementById('cartItemsContainer');
      container.innerHTML = '';

      if (Object.keys(cart).length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#64748b;">Cart is empty.</div>';
        document.getElementById('modalItemCount').textContent = '0';
        document.getElementById('modalGrandTotal').textContent = '0.00 ETB';
        closeCartModal();
        return;
      }

      let grandTotal = 0;
      let totalItemsCount = 0;

      Object.values(cart).forEach(entry => {
        const prod = entry.product;
        const price = parseFloat(prod.Selling_Price || 0);
        const subtotal = price * entry.qty;
        const maxQty = parseFloat(prod.Total_Qty_Bridge || 0);

        grandTotal += subtotal;
        totalItemsCount += entry.qty;

        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-name">${prod.Item_Name}</div>
            <div class="cart-item-details">${price.toFixed(2)} ETB × ${entry.qty}</div>
            <div class="cart-item-subtotal">Subtotal: ${subtotal.toFixed(2)} ETB</div>
          </div>
          <div class="qty-controls">
            <button class="btn-qty" onclick="updateQty('${prod.item_ID}', -1, ${maxQty})">-</button>
            <span class="qty-count">${entry.qty}</span>
            <button class="btn-qty" onclick="updateQty('${prod.item_ID}', 1, ${maxQty})">+</button>
          </div>
        `;
        container.appendChild(row);
      });

      document.getElementById('modalItemCount').textContent = totalItemsCount;
      document.getElementById('modalGrandTotal').textContent = `${grandTotal.toFixed(2)} ETB`;
    }

    function captureGPSLocation(isManualClick = false) {
      const btn = document.getElementById('locationBtn');
      const gpsField = document.getElementById('gpsCoordinates');
      const addressField = document.getElementById('deliveryAddress');

      if (gpsField.value && !isManualClick) return;

      if ("geolocation" in navigator) {
        if (isManualClick) btn.textContent = "⏳ Locating...";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const mapUrl = `https://maps.google.com/?q=${lat},${lng}`;
            
            gpsField.value = mapUrl;
            if (!addressField.value) {
              addressField.value = `GPS Pin: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            }

            btn.textContent = "✅ Location Attached!";
            btn.style.background = "#d1fae5";
            btn.style.color = "#065f46";
          },
          () => {
            if (isManualClick) {
              alert("Unable to detect GPS. Please enter your address manually.");
              btn.textContent = "📍 Retry Location Detection";
            }
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      }
    }

    function submitOrder() {
      const btnSubmit = document.getElementById('btnSubmitOrder');
      const name = document.getElementById('customerName').value.trim();
      const phone = document.getElementById('customerPhone').value.trim();
      const address = document.getElementById('deliveryAddress').value.trim();
      const gps = document.getElementById('gpsCoordinates').value;
      const notes = document.getElementById('orderNotes').value.trim();

      if (!name || !phone || !address) {
        alert("Please complete Full Name, Phone Number, and Delivery Address.");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Submitting Order...";

      const orderItems = Object.values(cart).map(entry => ({
        item_ID: entry.product.item_ID,
        item_code: entry.product.item_code || '',
        item_name: entry.product.Item_Name,
        unit_price: parseFloat(entry.product.Selling_Price || 0),
        quantity: entry.qty,
        subtotal: parseFloat(entry.product.Selling_Price || 0) * entry.qty
      }));

      const grandTotal = orderItems.reduce((sum, item) => sum + item.subtotal, 0);

      const payload = {
        action: "create_order",
        init_data: telegramInitData,
        customer: {
          name: name,
          telegram_user_id: telegramUserId,
          phone: phone,
          address: address,
          gps_location: gps || null,
          notes: notes || ""
        },
        items: orderItems,
        total_amount: grandTotal,
        currency: "ETB"
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        cart = {};
        localStorage.removeItem('stockcare_cart_backup');
        document.getElementById('orderNotes').value = '';
        document.getElementById('gpsCoordinates').value = '';
        document.getElementById('locationBtn').textContent = "📍 Attach GPS Location";
        document.getElementById('locationBtn').style.background = "#e0e7ff";
        document.getElementById('locationBtn').style.color = "#3730a3";

        updateTotals();
        renderCatalog();
        closeCartModal();

        btnSubmit.disabled = false;
        btnSubmit.textContent = "Place Order";

        const alertBox = document.getElementById('successAlert');
        alertBox.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        setTimeout(() => {
          alertBox.style.display = 'none';
        }, 5000);
      })
      .catch(err => {
        alert("Failed to submit order. Please try again.");
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Place Order";
      });
    }
  </script>
